<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <title>todo with LS 6th time</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
  <h3 class="bg-warning text-center">Todo-6th with Local storage</h3>

  <section>
    <div class="container-fluid">
      <div class="row mt-5">
        <div class="col-xxl-6 col-xl-4 offset-xl-1 col-lg-4 offset-lg-1 col-md-5 col-sm-12 mb-5">
          <form id="form">
            <div class="card">
              <h3 class="text-center bg-primary">Enter Your Todo Item</h3>
              <div class="card-body">
                <div class="form-group">
                  <label for="todoItem">Todo Item</label>
                  <input type="text" class="form-control" id="todoItem">
                </div>
                <button class="btn btn-sm btn-block btn-primary" id="addTodoBtn">Add Todo</button>
                <button type="button" class="btn btn-sm btn-block btn-primary d-none" id="updateTodoBtn">Update
                  Todo</button>

              </div>
            </div>
          </form>
        </div>

        <div class="col-sm-12 col-xxl-6 col-xl-6 col-lg-6 col-md-6 col-sm-12">
          <div class="card">
            <div class="card-body">
              <ul class="list-group" id="listsContainer">
                <h2 class="text-danger text-center d-none" id="todoContainer">No todo yet!!!</h2>
                <!-- <li class="list-group-item d-flex justify-content-between align-content-center">
                  <strong>HTML</strong>
                  <div>
                    <button class="btn btn-sm btn-primary mr-2">Edit</button>
                    <button class="btn btn-sm btn-danger">Delete</button>
                  </div>
                </li> -->
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="./assets/js/app.js"></script>
</body>




</html>
